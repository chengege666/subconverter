name: GitHub CI
on:
  push:
    branches: [ master ]
    tags:
      - '**'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布标签名，留空则自动使用 v0.9.9-run<运行号>'
        required: false
        default: ''
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  linux_build:
    strategy:
      matrix:
        include:
          - arch: x86
            artifact: subconverter_linux32
            os: ubuntu-latest
          - arch: amd64
            artifact: subconverter_linux64
            os: ubuntu-latest
          - arch: aarch64
            artifact: subconverter_aarch64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    name: Linux ${{ matrix.arch }} Build
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && (inputs.tag_name || format('v0.9.9-run{0}', github.run_number)) || github.ref_name }}
    steps:
      - name: Checkout base
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Add commit id into version
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: SHA=$(git rev-parse --short HEAD) && sed -i 's/\(v[0-9]\.[0-9]\.[0-9]\)/\1-'"$SHA"'/' src/version.h
      - name: Build
        run: docker run --rm -v $GITHUB_WORKSPACE:/root/workdir multiarch/alpine:${{ matrix.arch }}-latest-stable /bin/sh -c "apk add bash git nodejs npm && cd /root/workdir && chmod +x scripts/build.alpine.release.sh && bash scripts/build.alpine.release.sh"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: subconverter/
      - name: Package Release
        if: ${{ github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) }}
        run: tar czf ${{ matrix.artifact }}.tar.gz subconverter
      - name: Draft Release
        if: ${{ github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) }}
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.tar.gz
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
